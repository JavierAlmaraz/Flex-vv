name: Build APK v9

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivos del proyecto
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlexAlert"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.flexalert"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.flexalert"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Flex Alert"
                  android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FlexWatcherService"
                      android:exported="false"
                      android:label="Flex Alert"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="0"
              android:description="@string/service_desc" />
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_6'
          <resources>
              <string name="service_desc">Refresca la app de Flex y avisa con sonido cuando aparece un bloque en tu estación.</string>
          </resources>
          EOF_6
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">

          <LinearLayout
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:padding="24dp">

              <TextView
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Estaciones que activan la alarma (códigos separados por coma)" />
              <EditText android:id="@+id/etStations"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:inputType="textCapCharacters" android:text="DMX2,XMX4" />

              <TextView
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:paddingTop="8dp"
                  android:text="Segundos entre actualizaciones: mínimo / máximo (mínimo permitido: 2)" />
              <LinearLayout
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <EditText android:id="@+id/etMin"
                      android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"
                      android:inputType="number" android:text="2" />
                  <EditText android:id="@+id/etMax"
                      android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"
                      android:inputType="number" android:text="5" />
              </LinearLayout>

              <TextView
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:paddingTop="8dp"
                  android:text="Duración de la alarma (segundos)" />
              <EditText android:id="@+id/etAlarm"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:inputType="number" android:text="20" />

              <CheckBox android:id="@+id/cbAny"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:checked="true"
                  android:text="Si no es de mis estaciones, tocar cualquier oferta que aparezca" />

              <Button android:id="@+id/btnAccessibility"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="1. Activar servicio de accesibilidad" />

              <Button android:id="@+id/btnBattery"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="2. Quitar optimización de batería" />

              <Button android:id="@+id/btnStart"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="3. INICIAR" />

              <Button android:id="@+id/btnStop"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="DETENER" />

              <Button android:id="@+id/btnDiag"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="VER DIAGNÓSTICO" />

              <TextView android:id="@+id/status"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:paddingTop="16dp" android:text="Detenido" />
          </LinearLayout>
          </ScrollView>
          EOF_7
          mkdir -p app/src/main/java/com/example/flexalert
          cat > app/src/main/java/com/example/flexalert/MainActivity.kt <<'EOF_8'
          package com.example.flexalert

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("flex", Context.MODE_PRIVATE)
                  val status = findViewById<TextView>(R.id.status)
                  val etStations = findViewById<EditText>(R.id.etStations)
                  val etMin = findViewById<EditText>(R.id.etMin)
                  val etMax = findViewById<EditText>(R.id.etMax)
                  val etAlarm = findViewById<EditText>(R.id.etAlarm)
                  val cbAny = findViewById<CheckBox>(R.id.cbAny)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  etStations.setText(prefs.getString("stations", "DMX2,XMX4"))
                  etMin.setText(prefs.getInt("minSec", 2).toString())
                  etMax.setText(prefs.getInt("maxSec", 5).toString())
                  etAlarm.setText(prefs.getInt("alarmSec", 20).toString())
                  cbAny.isChecked = prefs.getBoolean("anyOffer", true)

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  findViewById<Button>(R.id.btnBattery).setOnClickListener {
                      val pm = getSystemService(PowerManager::class.java)
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      }
                  }

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      val svc = FlexWatcherService.instance
                      if (svc == null) {
                          status.text = "Activa primero el servicio de accesibilidad"
                          return@setOnClickListener
                      }
                      val stations = etStations.text.toString().trim()
                      if (stations.split(",").none { it.trim().isNotEmpty() }) {
                          status.text = "Escribe al menos un código de estación"
                          return@setOnClickListener
                      }
                      val mn = (etMin.text.toString().toIntOrNull() ?: 2).coerceAtLeast(2)
                      val mx = (etMax.text.toString().toIntOrNull() ?: 5).coerceAtLeast(mn)
                      val al = (etAlarm.text.toString().toIntOrNull() ?: 20).coerceIn(3, 120)
                      etMin.setText(mn.toString()); etMax.setText(mx.toString()); etAlarm.setText(al.toString())
                      prefs.edit()
                          .putString("stations", stations)
                          .putInt("minSec", mn).putInt("maxSec", mx).putInt("alarmSec", al)
                          .putBoolean("anyOffer", cbAny.isChecked)
                          .apply()
                      svc.start()
                      status.text = "Activo ($stations, cada $mn-$mx s). Abre Flex y deja la pantalla Ofertas."
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      FlexWatcherService.instance?.stop()
                      status.text = "Detenido"
                  }

                  findViewById<Button>(R.id.btnDiag).setOnClickListener {
                      status.text = "Servicio conectado: ${FlexWatcherService.instance != null}\n" +
                          "Apps vistas: ${Diag.pkgs.joinToString().ifEmpty { "ninguna" }}\n" +
                          "Ciclos de revision: ${Diag.loops}\n" +
                          "Contador leido: ${Diag.lastCount}\n" +
                          "Coincide estacion: ${Diag.lastMatch}\n" +
                          "Ultimo clic: ${Diag.lastTap}\n" +
                          "Ultimo Programar: ${Diag.lastAccept}"
                  }
              }
          }
          EOF_8
          mkdir -p app/src/main/java/com/example/flexalert
          cat > app/src/main/java/com/example/flexalert/FlexWatcherService.kt <<'EOF_9'
          package com.example.flexalert

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.graphics.Path
          import android.os.SystemClock
          import android.graphics.Rect
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlin.random.Random

          /** Datos de diagnostico (solo nombres de paquete y resultados, nunca textos de otras apps). */
          object Diag {
              val pkgs = LinkedHashSet<String>()
              var loops = 0
              var lastCount = "-"
              var lastMatch = false
              var lastTap = "-"
              var lastAccept = "-"
          }

          class FlexWatcherService : AccessibilityService() {

              companion object {
                  var instance: FlexWatcherService? = null
              }

              // Parametros configurables (se cargan al pulsar INICIAR).
              private var stations = listOf("DMX2", "XMX4")
              private var minDelay = 2000L
              private var maxDelay = 5000L
              private var alarmMs = 20000L
              private var anyOffer = true

              private fun loadPrefs() {
                  val p = getSharedPreferences("flex", MODE_PRIVATE)
                  stations = (p.getString("stations", "DMX2,XMX4") ?: "")
                      .split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  val mn = p.getInt("minSec", 2).coerceAtLeast(2)   // minimo 2 s
                  val mx = p.getInt("maxSec", 5).coerceAtLeast(mn)
                  minDelay = mn * 1000L
                  maxDelay = mx * 1000L
                  alarmMs = p.getInt("alarmSec", 20).coerceIn(3, 120) * 1000L
                  anyOffer = p.getBoolean("anyOffer", true)
              }

              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var paused = false   // oferta de tus estaciones en pantalla: no refrescar
              private var player: MediaPlayer? = null
              private var lastUnmatchedCount = 0

              // "0 de 0 ofertas", "1 de 1 oferta", "2 de 2 ofertas"...
              private val counterRegex = Regex("""(\d+)\s+de\s+(\d+)\s+ofertas?""", RegexOption.IGNORE_CASE)

              private data class Screen(val count: Int?, val match: Boolean, val found: String?, val detail: String?)

              private fun isAmazon(p: CharSequence?): Boolean = p?.startsWith("com.amazon.") == true

              private val refreshLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      Diag.loops++
                      if (paused) { handlePaused(); return }
                      val root = rootInActiveWindow
                      val pkg = root?.packageName
                      if (root != null && isAmazon(pkg)) {
                          val s = readScreen(root)
                          Diag.lastCount = s.count?.toString() ?: "no encontrado"
                          Diag.lastMatch = s.match
                          when {
                              s.count == null -> { /* no estamos en Ofertas: no tocar nada */ }
                              hit(s) -> { alarm(s.found, s.detail); return }
                              else -> {
                                  if (s.count == 0) lastUnmatchedCount = 0
                                  if (s.count > 0 && s.count != lastUnmatchedCount) {
                                      // Oferta de otra estacion: vibracion corta + aviso, y descanso.
                                      lastUnmatchedCount = s.count
                                      getSystemService(Vibrator::class.java)
                                          ?.vibrate(VibrationEffect.createOneShot(300, VibrationEffect.DEFAULT_AMPLITUDE))
                                      notifyUser("Oferta de otra estación", "Hay ${s.count} oferta(s) que no son de tus estaciones.", 2)
                                      Diag.lastTap = "vibro por oferta de otra estacion"
                                  } else {
                                      tapRefresh(root)
                                      handler.postDelayed({ checkAfterRefresh() }, 400)
                                  }
                              }
                          }
                      } else {
                          Diag.lastTap = "ventana activa no es de Amazon: $pkg"
                      }
                      scheduleNext()
                  }
              }

              private fun scheduleNext() {
                  if (running) handler.postDelayed(refreshLoop, Random.nextLong(minDelay, maxDelay + 1))
              }

              /** Con la oferta en pantalla no se refresca: solo se espera a que desaparezca o la aceptes. */
              private fun handlePaused() {
                  if (accepting) { handler.postDelayed(refreshLoop, 300); return }   // no estorbar mientras se acepta
                  val root = rootInActiveWindow
                  if (root != null && isAmazon(root.packageName)) {
                      val s = readScreen(root)
                      Diag.lastCount = s.count?.toString() ?: "no encontrado"
                      Diag.lastMatch = s.match
                      val gone = s.count != null && !hit(s)
                      if (gone) {
                          paused = false
                          silence()
                          Diag.lastTap = "oferta ya no esta: reanudando"
                          scheduleNext()
                          return
                      }
                  }
                  Diag.lastTap = "pausado: esperando a que aceptes o desaparezca la oferta"
                  handler.postDelayed(refreshLoop, 1000)
              }

              private fun checkAfterRefresh() {
                  if (!running || paused) return
                  val root = rootInActiveWindow ?: return
                  if (!isAmazon(root.packageName)) return
                  val s = readScreen(root)
                  if (hit(s)) {
                      handler.removeCallbacks(refreshLoop)
                      alarm(s.found, s.detail)
                  }
              }

              fun start() {
                  accepting = false
                  loadPrefs()
                  running = true
                  paused = false
                  lastUnmatchedCount = 0
                  Diag.loops = 0
                  handler.removeCallbacksAndMessages(null)
                  handler.postDelayed(refreshLoop, 3000)
              }

              fun stop() {
                  accepting = false
                  running = false
                  paused = false
                  handler.removeCallbacksAndMessages(null)
                  player?.release()
                  player = null
                  getSystemService(Vibrator::class.java)?.cancel()
              }

              private fun readScreen(root: AccessibilityNodeInfo): Screen {
                  val texts = ArrayList<String>()
                  collectText(root, texts)
                  var count: Int? = null
                  for (t in texts) {
                      val m = counterRegex.find(t) ?: continue
                      count = maxOf(m.groupValues[1].toInt(), m.groupValues[2].toInt())
                      break
                  }
                  val idx = texts.indexOfFirst { t -> stations.any { t.contains(it, ignoreCase = true) } }
                  val found = if (idx >= 0) stations.first { texts[idx].contains(it, ignoreCase = true) } else null
                  val detail = if (idx >= 0) buildDetail(texts, idx) else null
                  return Screen(count, found != null, found, detail)
              }

              private val timeRe = Regex("""\d{1,2}:\d{2}.*\d{1,2}:\d{2}""")
              private val priceRe = Regex("""\$\s?\d[\d,.]*""")
              private val titleRe = Regex("""\([A-Z0-9/]{3,}\)""")

              /** Texto de la tarjeta (estacion, horario, pago) tal como lo muestra la lista de ofertas. */
              private fun buildDetail(texts: List<String>, idx: Int): String {
                  val title = texts[idx]
                  val window = ArrayList<String>()
                  for (k in idx + 1 until minOf(idx + 6, texts.size)) {
                      if (titleRe.containsMatchIn(texts[k])) break   // empieza otra tarjeta
                      window.add(texts[k])
                  }
                  val time = window.firstOrNull { timeRe.containsMatchIn(it) }
                  val price = window.firstOrNull { priceRe.containsMatchIn(it) }
                  return listOfNotNull(title, time, price).joinToString("\n")
              }

              private fun collectText(node: AccessibilityNodeInfo?, out: MutableList<String>) {
                  if (node == null) return
                  node.text?.let { out.add(it.toString()) }
                  node.contentDescription?.let { out.add(it.toString()) }
                  for (i in 0 until node.childCount) collectText(node.getChild(i), out)
              }

              /** Hay oferta en pantalla: de tus estaciones o, si esta activado, cualquiera. */
              private fun hit(s: Screen): Boolean = (s.count ?: 0) > 0 && (s.match || anyOffer)

              private fun collectNodes(node: AccessibilityNodeInfo?, out: MutableList<AccessibilityNodeInfo>) {
                  if (node == null) return
                  out.add(node)
                  for (i in 0 until node.childCount) collectNodes(node.getChild(i), out)
              }

              private fun labelOf(n: AccessibilityNodeInfo): String =
                  listOfNotNull(n.text, n.contentDescription).joinToString(" ")

              /** Tarjeta de la oferta: primero una de tus estaciones; si no, la primera que aparezca. */
              private fun findOfferNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val all = ArrayList<AccessibilityNodeInfo>()
                  collectNodes(root, all)
                  val byStation = all.firstOrNull { n ->
                      val t = labelOf(n)
                      stations.any { t.contains(it, ignoreCase = true) }
                  }
                  if (byStation != null) return byStation
                  return if (anyOffer) all.firstOrNull { titleRe.containsMatchIn(labelOf(it)) } else null
              }

              /** Clic en el nodo (o en su padre clicable); si falla, toque por coordenadas. */
              private fun clickNode(node: AccessibilityNodeInfo): String {
                  var target: AccessibilityNodeInfo? = node
                  while (target != null && !target.isClickable) target = target.parent
                  if (target != null && target.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                      return "clic directo OK"
                  }
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  val path = Path().apply { moveTo(r.exactCenterX(), r.exactCenterY()) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 10L)
                  val ok = dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
                  return "toque por coordenadas (enviado=$ok)"
              }

              private fun tapRefresh(root: AccessibilityNodeInfo) {
                  val node = root.findAccessibilityNodeInfosByText("Actualizar")
                      .firstOrNull { it.text?.toString().equals("Actualizar", ignoreCase = true) }
                  if (node == null) {
                      Diag.lastTap = "no encontre el boton Actualizar"
                      return
                  }
                  Diag.lastTap = "Actualizar: " + clickNode(node)
              }

              // ---- Aceptacion ultra rapida ----
              private var accepting = false
              private var acceptDeadline = 0L
              private var detectAt = 0L

              /** Paso 1: tocar la oferta. Paso 2: tocar "Programar" en cuanto aparezca (por evento + sondeo de 30 ms). */
              private fun acceptOffer() {
                  val root = rootInActiveWindow
                  val offer = if (root != null && isAmazon(root.packageName)) findOfferNode(root) else null
                  if (offer == null) {
                      Diag.lastTap = "no encontre la oferta para tocar"
                      ring()
                      return
                  }
                  accepting = true
                  acceptDeadline = SystemClock.elapsedRealtime() + 6000
                  Diag.lastTap = "oferta: " + clickNode(offer)
                  handler.post(pollProgramar)
              }

              private val pollProgramar = object : Runnable {
                  override fun run() {
                      if (accepting && !tryProgramar()) handler.postDelayed(this, 30)
                  }
              }

              /** Devuelve true si ya termino (clic hecho o tiempo agotado). */
              private fun tryProgramar(): Boolean {
                  if (!accepting) return true
                  val root = rootInActiveWindow
                  if (root != null && isAmazon(root.packageName)) {
                      val btn = root.findAccessibilityNodeInfosByText("Programar")
                          .firstOrNull { labelOf(it).trim().equals("Programar", ignoreCase = true) }
                      if (btn != null) {
                          val how = clickNode(btn)
                          accepting = false
                          Diag.lastAccept = "$how en ${SystemClock.elapsedRealtime() - detectAt} ms desde la deteccion"
                          Diag.lastTap = "Programar: $how"
                          ring()
                          return true
                      }
                  }
                  if (SystemClock.elapsedRealtime() > acceptDeadline) {
                      accepting = false
                      Diag.lastAccept = "no aparecio el boton Programar"
                      Diag.lastTap = "no aparecio el boton Programar"
                      ring()
                      return true
                  }
                  return false
              }

              private val silenceTask = Runnable { silence() }

              private fun silence() {
                  handler.removeCallbacks(silenceTask)
                  player?.release()
                  player = null
                  getSystemService(Vibrator::class.java)?.cancel()
              }

              private fun notifyUser(title: String, text: String, id: Int, big: String? = null) {
                  try {
                      val b = Notification.Builder(this, "ofertas")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setAutoCancel(true)   // se cierra deslizandola
                      if (big != null) b.setStyle(Notification.BigTextStyle().bigText(big))
                      getSystemService(NotificationManager::class.java)?.notify(id, b.build())
                  } catch (_: Exception) { }
              }

              private var pendingFound: String? = null
              private var pendingDetail: String? = null

              private fun alarm(found: String? = null, detail: String? = null) {
                  detectAt = SystemClock.elapsedRealtime()
                  paused = true   // deja de refrescar hasta que la oferta desaparezca o la aceptes
                  pendingFound = found
                  pendingDetail = detail
                  acceptOffer()   // lo primero y mas rapido: tocar la oferta y luego "Programar"
                  handler.postDelayed(refreshLoop, 1000)
              }

              /** Sonido, vibracion y notificacion: se hacen DESPUES del clic para no retrasarlo. */
              private fun ring() {
                  val found = pendingFound
                  val detail = pendingDetail
                  val lines = detail?.split("\n").orEmpty()
                  val summary = lines.drop(1).joinToString(" · ").ifEmpty { lines.firstOrNull() ?: "Abre Flex para verla." }
                  notifyUser("¡Oferta en ${found ?: "tu estación"}!", summary, 1, detail)
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      player?.release()
                      player = MediaPlayer().apply {
                          setDataSource(this@FlexWatcherService, uri)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          isLooping = true
                          prepare()
                          start()
                      }
                      val vib = getSystemService(Vibrator::class.java)
                      vib.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 600, 400), 0))
                      handler.removeCallbacks(silenceTask)
                      handler.postDelayed(silenceTask, alarmMs)
                  } catch (_: Exception) { }
              }

              private var lastQuick = 0L

              /** Se llama en cada cambio de pantalla de Amazon: si ya hay oferta, se actua al instante. */
              private fun quickCheck() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastQuick < 60) return   // evita revisar el arbol mas de ~16 veces por segundo
                  lastQuick = now
                  val root = rootInActiveWindow ?: return
                  if (!isAmazon(root.packageName)) return
                  val s = readScreen(root)
                  Diag.lastCount = s.count?.toString() ?: "no encontrado"
                  Diag.lastMatch = s.match
                  if (hit(s)) {
                      handler.removeCallbacks(refreshLoop)
                      alarm(s.found, s.detail)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (accepting && event != null &&
                      (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                       event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED)) tryProgramar()
                  if (running && !paused && !accepting && event != null && isAmazon(event.packageName) &&
                      (event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||
                       event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED)) quickCheck()
                  val p = event?.packageName?.toString() ?: return
                  if (p != packageName && !p.startsWith("com.android.systemui")) {
                      Diag.pkgs.add(p)
                      while (Diag.pkgs.size > 8) Diag.pkgs.remove(Diag.pkgs.first())
                  }
              }

              override fun onInterrupt() { stop() }
              override fun onServiceConnected() {
                  instance = this
                  val nm = getSystemService(NotificationManager::class.java)
                  nm?.createNotificationChannel(
                      NotificationChannel("ofertas", "Ofertas", NotificationManager.IMPORTANCE_HIGH)
                  )
              }
              override fun onDestroy() { stop(); instance = null; super.onDestroy() }
          }
          EOF_9

